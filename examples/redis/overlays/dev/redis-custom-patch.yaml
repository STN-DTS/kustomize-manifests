#
# DEV REDIS CUSTOM CONFIG PATCH
#
# Configures Redis custom settings for development with reduced memory limits.
# This patch overrides the base custom configuration with dev-specific settings:
#   - Lower maxmemory (128mb) to fit within development resource constraints
#

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-custom-config
data:
  redis-custom.conf: |
    # Dev: maxmemory set to 128mb to leave fork CoW headroom within 384Mi limit
    maxmemory 128mb
