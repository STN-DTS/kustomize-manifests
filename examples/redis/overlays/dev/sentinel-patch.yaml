# DEV SENTINEL PATCH
#
# Configures Sentinels for development with minimal setup.
# This patch overrides the base Sentinel StatefulSet with dev-specific settings:
#   - 1 replica: Single Sentinel with no Sentinel redundancy
#   - Minimal resources: suitable for development environments
#
# Key differences from production:
#   - With monitor quorum 1, the Sentinel can authorize failover
#   - A single Sentinel provides no redundancy for monitoring/failover

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
spec:
  # A single Sentinel is not redundant.
  replicas: 1
  template:
    spec:
      containers:
        - name: sentinel
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
