#
# Redis Sentinel StatefulSet
#
# Runs a group of Sentinel instances that monitor the Redis deployment and
# coordinate automatic failover. Sentinels must form a quorum (majority) to
# agree on failover actions — using an odd number of replicas (3, 5, ...) is
# recommended for reliable decision-making.
#
# Highlights:
# - Stable identities via StatefulSet (redis-sentinel-0, -1, -2)
# - Headless service for peer discovery and internal communication
# - Preferred pod anti-affinity to improve fault tolerance
# - Keep replicas odd (3 recommended) so quorum = floor(N/2)+1
#
# Overlays may adjust replica counts, resource limits, and storage as needed.

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis-sentinel
  labels:
    app.kubernetes.io/role: sentinel

spec:
  #
  # Replica count: default 3 (recommended odd number for quorum).
  replicas: 3

  #
  # Parallel pod management avoids blocking peer recovery when ordinal 0 is
  # temporarily unhealthy.
  #
  podManagementPolicy: Parallel

  #
  # POD SELECTOR: Matches pods managed by this StatefulSet.
  #
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/role: sentinel

  #
  # Headless service provides stable DNS names used by Sentinels for peer discovery.
  # Sentinels use these addresses to form quorum, exchange config, and monitor Redis.
  # Keep replica counts odd to avoid split-brain and ensure clear quorum rules.
  serviceName: redis-sentinel-headless

  #
  # Pod template
  #
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/role: sentinel
    spec:
      automountServiceAccountToken: false

      # Allow Sentinels time to gracefully stop before forceful termination.
      terminationGracePeriodSeconds: 60

      #
      # Affinity / scheduling preferences
      #
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: redis
                    app.kubernetes.io/role: sentinel

      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      #
      # Init container: render a single flat /etc/redis/sentinel.conf (no includes)
      # so Sentinel's CONFIG REWRITE survives in-place container restarts cleanly.
      #
      initContainers:
        - name: init-sentinel
          image: docker.io/library/redis
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              escape_redis_str() {
                local s="$1"
                s="${s//\\/\\\\}"
                s="${s//\"/\\\"}"
                printf '%s' "$s"
              }

              detected_fqdn=$(hostname -f 2>/dev/null || true)
              if [[ "$detected_fqdn" == *.* ]]; then
                sentinel_fqdn="$detected_fqdn"
              else
                sentinel_fqdn="${POD_NAME}.${SENTINEL_HEADLESS_SERVICE}.${POD_NAMESPACE}.svc.cluster.local"
              fi
              echo "Sentinel Pod: $POD_NAME"
              echo "FQDN: $sentinel_fqdn (IP: $POD_IP)"

              escaped_redis_pass=$(escape_redis_str "$REDIS_PASSWORD")

              {
                cat /mnt/sentinel.conf
                printf '\n'
                cat /mnt/sentinel-custom.conf
                printf '\n# Generated by init-sentinel\n'
                printf 'sentinel auth-pass mymaster "%s"\n' "$escaped_redis_pass"
                printf 'sentinel announce-ip "%s"\n' "$sentinel_fqdn"
                printf 'sentinel announce-port 26379\n'
                if [ -n "${SENTINEL_PASSWORD:-}" ]; then
                  escaped_sentinel_pass=$(escape_redis_str "$SENTINEL_PASSWORD")
                  printf 'requirepass "%s"\n' "$escaped_sentinel_pass"
                  printf 'sentinel sentinel-pass "%s"\n' "$escaped_sentinel_pass"
                fi
              } > /etc/redis/sentinel.conf

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: sentinel-password
                  optional: true
            - name: SENTINEL_HEADLESS_SERVICE
              value: "redis-sentinel-headless"

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /etc/redis
            - name: sentinel-config
              mountPath: /mnt/sentinel.conf
              subPath: sentinel.conf
            - name: sentinel-custom-config
              mountPath: /mnt/sentinel-custom.conf
              subPath: sentinel-custom.conf

      #
      # Main container (redis-sentinel)
      #
      containers:
        - name: sentinel
          image: docker.io/library/redis

          ports:
            - name: sentinel
              containerPort: 26379

          env:
            - name: SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: sentinel-password
                  optional: true

          command:
            - redis-sentinel
            - /etc/redis/sentinel.conf

          # Resource requests and limits
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

          #
          # Health checks: require exact PONG output (handles optional Sentinel auth)
          #
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  if [ -n "${SENTINEL_PASSWORD:-}" ]; then
                    out=$(REDISCLI_AUTH="$SENTINEL_PASSWORD" redis-cli -p 26379 --no-auth-warning ping 2>/dev/null)
                  else
                    out=$(redis-cli -p 26379 --no-auth-warning ping 2>/dev/null)
                  fi
                  [ "$out" = "PONG" ]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  if [ -n "${SENTINEL_PASSWORD:-}" ]; then
                    out=$(REDISCLI_AUTH="$SENTINEL_PASSWORD" redis-cli -p 26379 --no-auth-warning ping 2>/dev/null)
                  else
                    out=$(redis-cli -p 26379 --no-auth-warning ping 2>/dev/null)
                  fi
                  [ "$out" = "PONG" ]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  if [ -n "${SENTINEL_PASSWORD:-}" ]; then
                    out=$(REDISCLI_AUTH="$SENTINEL_PASSWORD" redis-cli -p 26379 --no-auth-warning ping 2>/dev/null)
                  else
                    out=$(redis-cli -p 26379 --no-auth-warning ping 2>/dev/null)
                  fi
                  [ "$out" = "PONG" ]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          #
          # Lifecycle hooks
          #
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5

          #
          # Container security context
          #
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          #
          # VOLUME MOUNTS
          #
          volumeMounts:
            - name: config
              mountPath: /etc/redis

      #
      # Volumes (non-PVC)
      #
      volumes:
        - name: config
          emptyDir: {}

        - name: sentinel-config
          configMap:
            name: sentinel-config

        - name: sentinel-custom-config
          configMap:
            name: sentinel-custom-config
