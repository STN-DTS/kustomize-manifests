# DEPRECATED: Redis ClusterIP Service (static ordinal-0 endpoint)
#
# This Service is deprecated and may be removed in a future release. It targets
# only the initial Redis primary pod (`redis-0`) and does NOT follow Sentinel
# failovers: after failover, writes sent to this Service hit a read-only
# replica (`READONLY` errors) or an unavailable pod.
#
# Use a Sentinel-aware client pointing at `redis-sentinel:26379` to discover
# the current primary dynamically. Overlays that do not need this Service may
# delete it with `$patch: delete`. Overlays that keep it with `nameSuffix` must
# patch `statefulset.kubernetes.io/pod-name` to match the suffixed pod name.

apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    # Selector targets the expected master pod (pod-0) so the Service provides
    # a single, stable master endpoint. Overlays may change this behavior.
    app.kubernetes.io/name: redis
    app.kubernetes.io/role: server
    statefulset.kubernetes.io/pod-name: redis-0
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
