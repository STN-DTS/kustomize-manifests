# ==============================================================================
# Redis Custom Configuration
# ==============================================================================
# This file is intended for environment-specific overrides.
# init-redis appends it into the flat /etc/redis/redis.conf at pod startup.
#
# Use overlays to replace this file with environment-specific settings,
# such as 'maxmemory', 'maxmemory-policy', 'loglevel', or 'save' rules.
#
# Note: Do NOT put 'include' directives for ACL 'user' files here — Redis's
# CONFIG REWRITE copies included users into redis.conf and causes
# 'Duplicate user found' on restart. Instead, mount workload ACL '*.conf'
# files onto the 'init-redis' container at /etc/redis-acl (or REDIS_ACL_DIR);
# init-redis merges them into the generated aclfile (/etc/redis/users.acl).
# Do not redefine 'user default' in workload ACL files.
# ==============================================================================