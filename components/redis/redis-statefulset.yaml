#
# Redis StatefulSet (master + replicas)
#
# Manages Redis pods with stable network identities (redis-0, redis-1, ...).
# By convention `redis-0` is treated as the initial master and the init
# container arranges replication for non-master ordinals using the stable
# headless DNS name for the master. Sentinels handle automated failover at
# runtime; the StatefulSet itself does not automatically reassign master
# role in Kubernetes resources.
#
# Highlights:
# - Stable pod identities and ordered scaling from StatefulSet
# - Headless service enables per-pod DNS names needed for Redis replication
# - Preferred pod anti-affinity spreads replicas across nodes
# - Init container creates per-pod replication configuration using the pod name
# - PersistentVolumeClaims provide per-pod durable storage
# - PreStop hook triggers a save on shutdown to reduce data loss risk
#
# Overlays may adjust replica count, storage size, resource requests/limits,
# or replace the init mechanism if you use an external bootstrapper.

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis
  labels:
    app.kubernetes.io/role: server

spec:
  #
  # Replica count: default 3 (1 master + 2 replicas) for basic HA.
  #
  replicas: 3

  #
  # Parallel pod management avoids blocking recovery of healthy replicas if
  # ordinal 0 is temporarily unhealthy.
  #
  podManagementPolicy: Parallel

  #
  # POD SELECTOR: Matches pods managed by this StatefulSet.
  #
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/role: server

  #
  # serviceName ties this StatefulSet to the headless service used for DNS.
  # Pods will be addressable as <statefulset>-<ordinal>.<serviceName>.
  #
  serviceName: redis-headless

  #
  # Persistent storage template: each pod gets its own PVC named by ordinal.
  # Size PVC to at least 4x maxmemory (default 1Gi for 256mb maxmemory) to
  # leave headroom for AOF, RDB, and rewrite temporary files.
  #
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  #
  # Pod template
  #
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/role: server
    spec:
      automountServiceAccountToken: false

      # Allow Redis time to persist data on termination before SIGKILL.
      terminationGracePeriodSeconds: 60

      # Affinity / scheduling preferences
      #
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: redis
                    app.kubernetes.io/role: server

      #
      # Pod-level security context
      #
      securityContext:
        runAsNonRoot: true
        runAsUser: 35534
        runAsGroup: 35534
        fsGroup: 35534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      #
      # Init container prepares a single flat /etc/redis/redis.conf and
      # /etc/redis/users.acl so CONFIG REWRITE works cleanly across in-place
      # container restarts without include-file conflicts.
      #
      initContainers:
        - name: init-redis
          image: docker.io/library/redis
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              escape_redis_str() {
                local s="$1"
                s="${s//\\/\\\\}"
                s="${s//\"/\\\"}"
                printf '%s' "$s"
              }

              # 1. Identify Pod and Stable FQDN
              ordinal="${POD_NAME##*-}"
              statefulset="${POD_NAME%-${ordinal}}"
              pod_short="${POD_NAME}.${REDIS_HEADLESS_SERVICE}"
              detected_fqdn=$(hostname -f 2>/dev/null || true)
              if [[ "$detected_fqdn" == *.* ]]; then
                pod_fqdn="$detected_fqdn"
              else
                pod_fqdn="${pod_short}.${POD_NAMESPACE}.svc.cluster.local"
              fi
              fqdn_domain="${pod_fqdn#${POD_NAME}.}"
              static_master="${statefulset}-0.${fqdn_domain}"

              echo "Pod: $POD_NAME (Ordinal: $ordinal)"
              echo "FQDN: $pod_fqdn (IP: $POD_IP)"

              # 2. Generate ACL File (default user via SHA-256 hash + optional workload ACLs)
              pass_hash=$(printf '%s' "$REDIS_PASSWORD" | sha256sum | cut -d' ' -f1)
              printf 'user default on #%s ~* &* +@all\n' "$pass_hash" > /etc/redis/users.acl

              if [ -n "${REDIS_ACL_DIR:-}" ] && [ -d "$REDIS_ACL_DIR" ]; then
                shopt -s nullglob
                for acl_file in "$REDIS_ACL_DIR"/*.conf; do
                  # Strip blank lines and comments (Redis aclfile syntax rejects '#' comments)
                  grep -vE '^[[:space:]]*(#|$)' "$acl_file" >> /etc/redis/users.acl || true
                done
                shopt -u nullglob
              fi

              # 3. Discover Current Primary via Sentinel (with retry and response validation)
              master_host=""
              master_port="6379"
              sentinel_answered=false

              echo "Attempting primary discovery via Sentinel ($SENTINEL_HOST:26379)..."
              for attempt in 1 2 3; do
                sentinel_info=""
                if [ -n "${SENTINEL_PASSWORD:-}" ]; then
                  sentinel_info=$(REDISCLI_AUTH="$SENTINEL_PASSWORD" timeout 3s redis-cli -h "$SENTINEL_HOST" -p 26379 --no-auth-warning --raw sentinel get-master-addr-by-name mymaster 2>/dev/null || true)
                else
                  sentinel_info=$(timeout 3s redis-cli -h "$SENTINEL_HOST" -p 26379 --no-auth-warning --raw sentinel get-master-addr-by-name mymaster 2>/dev/null || true)
                fi

                reported_host=$(printf '%s\n' "$sentinel_info" | sed -n '1p')
                reported_port=$(printf '%s\n' "$sentinel_info" | sed -n '2p')

                if [ -n "$reported_host" ] && [[ ! "$reported_host" =~ [[:space:]] ]] && [[ "$reported_port" =~ ^[0-9]+$ ]]; then
                  sentinel_answered=true
                  echo "Sentinel reports primary is: ${reported_host}:${reported_port}"
                  if [ "$reported_host" = "$pod_fqdn" ] || [ "$reported_host" = "$pod_short" ] || [ "$reported_host" = "$POD_IP" ]; then
                    master_host=""
                  else
                    master_host="$reported_host"
                    master_port="$reported_port"
                  fi
                  break
                fi

                [ "$attempt" -lt 3 ] && sleep 1
              done

              # 4. Fallback when Sentinel is unreachable: check Redis peers before bootstrap default
              if [ "$sentinel_answered" = false ]; then
                echo "Sentinel unreachable or returned no valid primary. Probing Redis peers..."
                peer_master=""
                peer_count="${REDIS_PEER_SCAN_COUNT:-3}"
                for (( idx=0; idx<peer_count; idx++ )); do
                  [ "$idx" = "$ordinal" ] && continue
                  peer_fqdn="${statefulset}-${idx}.${fqdn_domain}"
                  peer_info=$(REDISCLI_AUTH="$REDIS_PASSWORD" timeout 2s redis-cli -h "$peer_fqdn" -p 6379 --no-auth-warning info replication 2>/dev/null || true)
                  if printf '%s\n' "$peer_info" | grep -q '^role:master'; then
                    peer_master="$peer_fqdn"
                    echo "Discovered active primary via peer probe: $peer_master"
                    break
                  fi
                done

                if [ -n "$peer_master" ]; then
                  master_host="$peer_master"
                elif [ "$ordinal" = "0" ]; then
                  master_host=""
                else
                  master_host="$static_master"
                fi
              fi

              # 5. Render Single Flat Configuration File (no includes)
              escaped_pass=$(escape_redis_str "$REDIS_PASSWORD")
              {
                cat /mnt/redis.conf
                printf '\n'
                cat /mnt/redis-custom.conf
                printf '\n# Generated by init-redis\n'
                printf 'aclfile "/etc/redis/users.acl"\n'
                printf 'masterauth "%s"\n' "$escaped_pass"
                printf 'replica-announce-ip "%s"\n' "$pod_fqdn"
                printf 'replica-announce-port 6379\n'
                if [ -n "$master_host" ]; then
                  echo "Role: REPLICA of ${master_host}:${master_port}" >&2
                  printf 'replicaof "%s" %s\n' "$master_host" "$master_port"
                else
                  echo "Role: PRIMARY" >&2
                fi
              } > /etc/redis/redis.conf

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: SENTINEL_HOST
              value: "redis-sentinel"
            - name: SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: sentinel-password
                  optional: true
            - name: REDIS_HEADLESS_SERVICE
              value: "redis-headless"
            - name: REDIS_ACL_DIR
              value: "/etc/redis-acl"
            - name: REDIS_PEER_SCAN_COUNT
              value: "3"

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /etc/redis
            - name: redis-config
              mountPath: /mnt/redis.conf
              subPath: redis.conf
            - name: redis-custom-config
              mountPath: /mnt/redis-custom.conf
              subPath: redis-custom.conf

      #
      # Main redis container
      #
      containers:
        - name: redis
          image: docker.io/library/redis

          ports:
            - name: redis
              containerPort: 6379

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password

          command:
            - redis-server
            - /etc/redis/redis.conf

          # Resource requests and limits (keep maxmemory <= 50% of memory limit for fork CoW headroom)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

          #
          # Health checks:
          # - startupProbe protects slow AOF/RDB loads before liveness runs
          # - readinessProbe requires exact PONG (rejects NOAUTH/LOADING)
          # - livenessProbe checks event loop responsiveness while tolerating LOADING/MASTERDOWN
          #
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - out=$(REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping 2>/dev/null) && [ "$out" = "PONG" ]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - out=$(REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping 2>/dev/null) && [ "$out" = "PONG" ]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  out=$(REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping 2>/dev/null)
                  case "$out" in
                    PONG|LOADING*|MASTERDOWN*) exit 0 ;;
                    *) exit 1 ;;
                  esac
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          #
          # Lifecycle hooks: brief drain sleep before SIGTERM triggers Redis's native save/shutdown.
          #
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5

          #
          # Container security context
          #
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          #
          # VOLUME MOUNTS
          #
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis

      #
      # Volumes (non-PVC)
      #
      volumes:
        - name: config
          emptyDir: {}

        - name: redis-config
          configMap:
            name: redis-config

        - name: redis-custom-config
          configMap:
            name: redis-custom-config
